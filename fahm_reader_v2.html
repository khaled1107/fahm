// ── ACTIVITY DAY + STREAK (60-second reader presence) ────────
// QF users: POSTs to QF Activity Days API server-side, returns streak.
// Google users: session is recorded in Supabase; streak computed client-side.
let _activityDayTimer          = null;
let _activityDayFiredForSurah  = null;

function startActivityDayTimer(surahNum) {
  if (_activityDayTimer) { clearTimeout(_activityDayTimer); _activityDayTimer = null; }
  if (!currentUser) return;
  if (_activityDayFiredForSurah === surahNum) return;
  const verseCount = VERSE_COUNTS_ARR[surahNum - 1] || 7;
  _activityDayTimer = setTimeout(async () => {
    _activityDayTimer = null;
    _activityDayFiredForSurah = surahNum;
    console.log('[activity] 60 s on surah %d — posting activity day', surahNum);
    await postActivityDay(surahNum, verseCount);
  }, 60_000);
}

async function postActivityDay(surahNum, verseCount) {
  if (!currentUser) return;
  const provider = currentUser._provider === 'qf' ? 'qf' : 'supabase';
  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let token;
  if (provider === 'qf') {
    const s = await getQFSession();
    if (!s?.access_token) return;
    token = s.access_token;
  } else {
    const s = await getSession();
    if (!s?.access_token) return;
    token = s.access_token;
  }
  try {
    const r = await fetch('/api/track-section', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ provider, surah_number: surahNum, verse_count: verseCount,
        activity: true, timezone })
    });
    if (r.ok) {
      const data = await r.json();
      console.log('[activity] response:', data);
      if (data.streak != null && data.streak > 0) {
        updateStreakDisplay(data.streak);
      } else {
        await fetchLocalStreak();
      }
    }
  } catch (e) {
    console.warn('[activity] postActivityDay failed:', e.message);
  }
}

function computeConsecutiveDays(rows) {
  const dates = [...new Set(rows.map(r => r.completed_at.slice(0, 10)))].sort().reverse();
  let streak = 0;
  let expected = new Date().toISOString().slice(0, 10);
  for (const d of dates) {
    if (d === expected) {
      streak++;
      const dt = new Date(d + 'T00:00:00Z');
      dt.setUTCDate(dt.getUTCDate() - 1);
      expected = dt.toISOString().slice(0, 10);
    } else if (d < expected) {
      break;
    }
  }
  return streak;
}

async function fetchLocalStreak() {
  if (!currentUser) return;

  if (currentUser._provider === 'qf') {
    const cached = parseInt(localStorage.getItem('fahm_qf_streak') || '0', 10);
    if (cached > 0) updateStreakDisplay(cached);
    const userId = currentUser.id;
    console.log('[streak] QF user id (JSON):', JSON.stringify(userId));
    console.log('[streak] QF user id length:', userId.length);
    try {
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/fahm_reading_sessions?user_id=eq.${encodeURIComponent(userId)}&select=completed_at&order=completed_at.desc`,
        { headers: SB_HEADERS }
      );
      if (r.ok) {
        const rows = await r.json();
        const streak = computeConsecutiveDays(rows);
        console.log('[streak] QF streak from Supabase: %d days', streak);
        if (streak > 0) updateStreakDisplay(streak);
      }
    } catch (e) {
      console.warn('[streak] QF Supabase fetch failed (using cache):', e.message);
    }
    return;
  }

  const session = await getSession();
  if (!session?.user) return;
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/fahm_reading_sessions?user_id=eq.${session.user.id}&select=completed_at&order=completed_at.desc`,
      { headers: { ...SB_HEADERS, Authorization: `Bearer ${session.access_token}` } }
    );
    if (!r.ok) return;
    const rows = await r.json();
    const streak = computeConsecutiveDays(rows);
    console.log('[streak] Google streak computed: %d days', streak);
    updateStreakDisplay(streak);
  } catch (e) {
    console.warn('[streak] fetchLocalStreak failed:', e.message);
  }
}

const fetchGoogleStreak = fetchLocalStreak;

// ── SECTION DWELL TRACKING ───────────────────────────────────
// Fires once per section per page-load after 10s of continuous on-screen dwell (signed-in users only).
let _sectionDwellObserver = null;
const _sectionDwellTimers = new Map();
const _sectionDwellSent = new Set();
const DWELL_MS = 10000;

function setupSectionDwellObserver() {
  if (_sectionDwellObserver) { _sectionDwellObserver.disconnect(); _sectionDwellObserver = null; }
  if (!currentUser) return;
  if (typeof IntersectionObserver === 'undefined') return;

  _sectionDwellObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      const id = entry.target.dataset.sectionId;
      if (!id || _sectionDwellSent.has(id)) continue;
      if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
        if (!_sectionDwellTimers.has(id)) {
          const handle = setTimeout(() => {
            _sectionDwellTimers.delete(id);
            _sectionDwellSent.add(id);
            sendSectionComplete(id);
          }, DWELL_MS);
          _sectionDwellTimers.set(id, handle);
        }
      } else {
        const handle = _sectionDwellTimers.get(id);
        if (handle) { clearTimeout(handle); _sectionDwellTimers.delete(id); }
      }
    }
  }, { threshold: [0, 0.5] });

  document.querySelectorAll('.section-block').forEach(el => _sectionDwellObserver.observe(el));
}

async function sendSectionComplete(sectionId) {
  if (!currentUser) return;
  const [surahStr] = sectionId.split('-');
  const surahNum = parseInt(surahStr, 10);
  if (!surahNum) return;

  let token, provider;
  if (currentUser._provider === 'qf') {
    const s = await getQFSession();
    if (!s?.access_token) return;
    token = s.access_token; provider = 'qf';
  } else {
    const s = await getSession();
    if (!s?.access_token) return;
    token = s.access_token; provider = 'supabase';
  }

  try {
    await fetch('/api/track-section', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ provider, surah_number: surahNum, section_id: sectionId })
    });
  } catch (e) {
    // Swallow — best-effort streak signal, no UX impact.
  }
}

// ── PROGRESS SYNC ────────────────────────────────────────────
async function syncProgressToDB(surahNum) {
  if (currentUser?._provider === 'qf') return; // QF users have no Supabase auth; section completions stream via /api/track-section
  const session = await getSession();
  if (!session) return;
  await fetch(`${SUPABASE_URL}/rest/v1/fahm_user_progress`, {
    method: 'POST',
    headers: {
      ...SB_HEADERS,
      'Authorization': `Bearer ${session.access_token}`,
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({
      user_id: session.user.id,
      surah_number: surahNum,
      completed: true,
      last_read_at: new Date().toISOString()
    })
  });
}

async function syncProgressFromDB() {
  const session = await getSession();
  if (!session) return;
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/fahm_user_progress?user_id=eq.${session.user.id}&completed=eq.true&select=surah_number`,
    { headers: { ...SB_HEADERS, 'Authorization': `Bearer ${session.access_token}` } }
  );
  if (!r.ok) return;
  const rows = await r.json();
  rows.forEach(row => completedSurahs.add(row.surah_number));
  saveCompleted();
  renderSidebar();
  renderMobileList();
}

// Init auth on page load
(async () => {
  await handleAuthCallback();
  if (!currentUser) {
    const session = await getSession();
    if (session?.user) {
      currentUser = session.user;
      await syncProgressFromDB();
    }
  }
  if (!currentUser) {
    const qf = await getQFSession();
    if (qf?.user) currentUser = qf.user;
  }
  updateAuthUI();
  if (currentUser) {
    setupSectionDwellObserver();
    startActivityDayTimer(currentSurah?.number || 1);
    fetchLocalStreak();
  }
})();

// ── FEEDBACK ────────────────────────────────────────────────
function toggleFeedback() {
  const overlay = document.getElementById('feedbackOverlay');
  if (overlay.classList.contains('open')) {
    closeFeedback();
  } else {
    openFeedback();
  }
}

function openFeedback() {
  document.getElementById('feedbackOverlay').classList.add('open');
  document.getElementById('feedbackContent').innerHTML = `
    <p class="feedback-title">Share your feedback</p>
    <p class="feedback-sub">Help us improve Fahm. All feedback is read personally.</p>
    <textarea id="feedbackText" class="feedback-textarea" placeholder="What's on your mind? What could be better? What do you love?" rows="5"></textarea>
    <div class="feedback-optional">
      <label class="feedback-checkbox-row">
        <input type="checkbox" id="feedbackWantReply" onchange="toggleContactFields()">
        <span>I'd like to hear back</span>
      </label>
      <div id="feedbackContactFields" style="display:none; margin-top:10px; flex-direction:column; gap:8px;">
        <input type="text" id="feedbackName" class="feedback-input" placeholder="Your name (optional)">
        <input type="email" id="feedbackEmail" class="feedback-input" placeholder="Email address (optional)">
      </div>
    </div>
    <button class="feedback-submit" onclick="submitFeedback()">Send feedback</button>`;
  setTimeout(() => document.getElementById('feedbackText')?.focus(), 100);
}

function closeFeedback() {
  document.getElementById('feedbackOverlay').classList.remove('open');
}

function toggleContactFields() {
  const checked = document.getElementById('feedbackWantReply').checked;
  const fields = document.getElementById('feedbackContactFields');
  if (fields) fields.style.display = checked ? 'flex' : 'none';
}

async function submitFeedback() {
  const text = document.getElementById('feedbackText')?.value?.trim();
  if (!text) {
    document.getElementById('feedbackText')?.focus();
    return;
  }

  const wantReply = document.getElementById('feedbackWantReply')?.checked || false;
  const name  = document.getElementById('feedbackName')?.value?.trim() || null;
  const email = document.getElementById('feedbackEmail')?.value?.trim() || null;

  const btn = document.querySelector('.feedback-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

  const payload = {
    feedback_text: text,
    want_reply:    wantReply,
    name:          name,
    email:         email,
    lang:          langPrefs.lang,
    surah_number:  currentSurah?.number || null,
    user_id:       currentUser?.id || null,
    created_at:    new Date().toISOString()
  };

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/fahm_feedback`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
      body: JSON.stringify(payload)
    });

    if (!r.ok) throw new Error(r.status);

    gtag('event', 'feedback_submitted', { surah_number: currentSurah?.number });

    document.getElementById('feedbackContent').innerHTML = `
      <div class="feedback-success">
        <div class="feedback-success-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20,6 9,17 4,12"/>
          </svg>
        </div>
        <p style="font-size:1rem;font-weight:500;color:var(--text-primary);margin:0 0 0.5rem;">Thank you!</p>
        <p style="font-size:0.875rem;color:var(--text-muted);margin:0 0 1.5rem;">Your feedback has been received. It means a lot.</p>
        <button onclick="closeFeedback()" style="background:var(--teal);color:white;border:none;border-radius:8px;padding:0.5rem 1.5rem;font-size:0.875rem;cursor:pointer;font-family:var(--sans);">Close</button>
      </div>`;
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Send feedback'; }
    alert('Something went wrong. Please try again.');
  }
}

function goHome() {
  closeSidebar();
  showMobileList();
}

const HAMBURGER_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>`;

function syncSidebarBtn() {
  const btn = document.getElementById('sidebarToggleBtn');
  if (!btn) return;
  btn.innerHTML = HAMBURGER_ICON;
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const main = document.getElementById('mainReader');
  if (window.innerWidth <= 768) {
    const isOpen = sidebar.classList.toggle('open');
    overlay.classList.toggle('visible', isOpen);
  } else {
    const isCollapsed = sidebar.classList.toggle('collapsed');
    main.classList.toggle('sidebar-collapsed', isCollapsed);
  }
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const main = document.getElementById('mainReader');
  if (window.innerWidth <= 768) {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
  } else {
    sidebar.classList.add('collapsed');
    main.classList.add('sidebar-collapsed');
  }
}

function renderReader() {
  const s = currentSurah;
  const content = document.getElementById('readerContent');
  const done = isComplete(s.number);
  const isBn = langPrefs.lang === 'bn';

  // Use Bangla or English content based on language setting
  const intro = isBn ? (s.introduction_bn || s.introduction) : s.introduction;

  if (!intro) {
    content.innerHTML = `
      <nav class="reader-nav">
        <span class="nav-breadcrumb"><span>${s.name}</span></span>
      </nav>
      <div style="text-align:center; padding: 4rem 2rem; color: var(--text-muted);">
        <div style="font-size:2.5rem; margin-bottom:1rem; font-family:'Scheherazade New',serif;">${s.arabic}</div>
        <div style="font-family:var(--serif); font-size:1.1rem; color:var(--text-secondary);">${s.name} · ${t('comingSoon')}</div>
        <div style="font-size:0.875rem; margin-top:0.5rem;">${num(s.verses)} ${t('verses')} · ${langPrefs.lang === 'bn' ? (s.type === 'Madani' ? 'মাদানী' : 'মক্কী') : s.type}</div>
      </div>`;
    return;
  }

  const revPeriod = getRevelationPeriodLabel(s.number, s.type);
  const introParas = intro.split('\n\n').map(p => `<p>${p}</p>`).join('');
  const overviewLabel = isBn ? 'সারসংক্ষেপ' : 'Overview';

  const bismillah = s.number !== 9 ? `
    <div class="bismillah">
      <div class="bismillah-arabic">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>
      <div class="bismillah-translation">${t('bismillah')}</div>
    </div>` : '';

  const sectionsHTML = s.sections.map((sec, idx) => {
    const btnId = `audio-btn-${s.number}-${sec.num}`;
    const progressId = `audio-prog-${s.number}-${sec.num}`;

    const sectionTitle   = isBn ? (sec.title_bn   || sec.title)   : sec.title;
    const sectionContext = isBn ? (sec.context_bn  || sec.context) : sec.context;
    const sectionBridge  = isBn ? (sec.bridge_bn   || sec.bridge)  : sec.bridge;
    const contextLabel   = isBn ? 'ঐতিহাসিক প্রেক্ষাপট' : 'Historical context';
    const bridgeLabel    = isBn ? 'আয়াতগুলো বোঝা' : 'Understanding these verses';
    const sectionLabel   = isBn ? 'অংশ' : 'Section';

    const versesHTML = sec.translation.map((t, i) => {
      const vk = (sec.keys[i] || '').replace(':', '-');
      const rawKey = sec.keys[i] || '';
      const sahihText    = sec.sahih        && sec.sahih[i]        ? sec.sahih[i]        : null;
      const translitText = sec.translit     && sec.translit[i]     ? sec.translit[i]     : null;
      const bnTaisirText = sec.bn_taisirul  && sec.bn_taisirul[i]  ? sec.bn_taisirul[i]  : null;
      const bnRawaiText  = sec.bn_rawai     && sec.bn_rawai[i]     ? sec.bn_rawai[i]     : null;
      return `
      <div class="verse-row" data-verse-key="${vk}">
        <span class="verse-key">${verseKey(rawKey)}</span>
        <div class="verse-content">
          ${sec.arabic && sec.arabic[i] ? `<div class="verse-arabic">${sec.arabic[i]}</div>` : ''}
          ${translitText ? `<div class="verse-translit" id="translit-${vk}">${translitText}</div>` : ''}
          <div class="verse-translation" id="abdel-${vk}">${t}</div>
          ${sahihText ? `
            <div class="verse-secondary" id="sahih-${vk}">
              <div class="verse-secondary-label">Sahih International</div>
              ${sahihText}
            </div>` : ''}
          ${bnTaisirText ? `
            <div class="verse-bn-primary" id="bn-taisirul-${vk}">
              ${bnTaisirText}
            </div>` : ''}
          ${bnRawaiText ? `
            <div class="verse-bn-secondary" id="bn-rawai-${vk}">
              <div class="verse-secondary-label">রাওয়াই আল-বায়ান</div>
              ${bnRawaiText}
            </div>` : ''}
        </div>
      </div>`;
    }).join('');

    const divider = idx > 0 ? `
      <div class="section-divider">
        <div class="section-divider-line"></div>
        <div class="section-divider-dot"></div>
        <div class="section-divider-line"></div>
      </div>` : '';

    return `
      ${divider}
      <div class="section-block" data-section-id="${s.number}-${sec.num}">
        <div class="section-header">
          <div class="section-title-group">
            <div class="section-eyebrow">${sectionLabel} ${num(sec.num)}</div>
            <div class="section-title">${sectionTitle}</div>
            <div class="section-range">${verseRange(sec.range)}</div>
          </div>
          <div class="audio-player">
            <button class="audio-btn" id="${btnId}"
              data-keys='${JSON.stringify(sec.keys)}'
              data-title='${sec.title.replace(/'/g, "&#39;")}'
              onclick="toggleAudio(${s.number}, ${sec.num}, this.dataset.title, '${btnId}', '${progressId}', JSON.parse(this.dataset.keys))">
              ${playIcon()}
            </button>
            <div class="audio-progress-wrap" id="${progressId}">
              <div class="audio-progress-fill"></div>
            </div>
          </div>
        </div>
        <div class="context-block">
          <svg class="context-icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r="0.5" fill="currentColor"/></svg>
          <div>
            <div class="context-label">${contextLabel}</div>
            <div class="context-text">${sectionContext}</div>
          </div>
        </div>
        <div class="verses-block">${versesHTML}</div>
        <div class="bridge-block">
          <div class="bridge-label">${bridgeLabel}</div>
          <div class="bridge-text">${sectionBridge}</div>
        </div>
      </div>`;
  }).join('');

  const markCompleteHTML = `
    <div class="mark-complete-block">
      <button class="mark-complete-btn ${done ? 'done' : ''}" id="markCompleteBtn"
        onclick="${done ? '' : `markComplete(${s.number})`}">
        ${done
          ? `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2.5"><polyline points="2,8 6,12 14,4"/></svg> ${t('completed')}`
          : `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><polyline points="5,8 7,10 11,6"/></svg> ${t('markComplete')}`
        }
      </button>
      <div class="completion-message ${done ? 'visible' : ''}" id="completionMsg">
        ${t('youCompleted', s.name)}
      </div>
      <button class="next-btn ${done ? 'visible' : ''}" id="nextSurahBtn" onclick="nextSurah()">
        ${t('continueNext')}
      </button>
    </div>`;

  content.innerHTML = `
    <nav class="reader-nav">
      <button class="mobile-toggle" id="sidebarToggleBtn" onclick="toggleSidebar()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
        </svg>
      </button>
      <span class="nav-breadcrumb">
        <button class="mobile-back-btn" onclick="showMobileList()" id="mobileBackBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="10,2 4,8 10,14"/></svg>
          ${t('allSurahs')}
        </button>
        <span id="desktopBreadcrumb"><span>${s.name}</span></span>
      </span>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="nav-feedback-btn" onclick="openFeedback()" aria-label="Send feedback">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="14" y1="2" x2="7" y2="9"/><polygon points="14,2 9,14 7,9 2,7"/></svg>
        </button>
        <span class="streak-chip" id="streakChip"></span>
        <button class="auth-nav-btn" id="authNavBtn" onclick="toggleAuthModal()" aria-label="Sign in">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg><span class="auth-label"> Sign in</span>
        </button>
        <div class="display-settings-wrap">
        <button class="globe-btn" id="globeBtn" onclick="toggleSettingsPanel()" aria-label="Display settings">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="6.5"/>
            <ellipse cx="8" cy="8" rx="3" ry="6.5"/>
            <line x1="1.5" y1="6" x2="14.5" y2="6"/>
            <line x1="1.5" y1="10" x2="14.5" y2="10"/>
          </svg>
          <span id="globeLangLabel" style="font-size:0.7rem;font-weight:600;letter-spacing:0.03em;">${LANG_DEFS[langPrefs.lang].flag}</span>
        </button>
        <div class="lang-tooltip" id="langTooltip">
          Select your language and display preferences
          <div class="lang-tooltip-arrow"></div>
        </div>
        <div class="settings-dropdown" id="settingsDropdown">
          ${settingsPanelHTML()}
        </div>
      </div>
    </nav>

    <div class="surah-header">
      <div class="surah-badge">
        <span class="surah-number-badge">${num(s.number)}</span>
        ${revPeriod}
      </div>
      <div class="surah-arabic-title">${s.arabic}</div>
      <div class="surah-english-title">${s.name}</div>
      <div class="surah-meaning">${s.meaning}</div>
      <div class="surah-stats">
        <div class="stat">
          <div class="stat-value">${num(s.verses)}</div>
          <div class="stat-label">${t('versesLabel')}</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div class="stat-value">${num(s.sections.length)}</div>
          <div class="stat-label">${t('sections')}</div>
        </div>
      </div>
    </div>

    <div class="intro-block">
      <div class="intro-label">${overviewLabel}</div>
      <div class="intro-text">${introParas}</div>
    </div>

    ${bismillah}
    ${sectionsHTML}
    ${markCompleteHTML}
  `;

  // Refresh auth button state after nav is rebuilt
  updateAuthUI();
  // Restore streak chip — the nav span is recreated on every render.
  updateStreakDisplay(_lastStreakCount);
  // Re-attach dwell observer so newly rendered section-block elements are watched
  if (currentUser) setupSectionDwellObserver();
}

window.addEventListener('scroll', () => {
  // Don't process scroll events on the mobile surah list screen
  if (isMobile() && document.getElementById('mobileListScreen').style.display !== 'none') return;

  const main = document.getElementById('mainReader');
  const scrollTop = window.scrollY;
  const docHeight = main.scrollHeight - window.innerHeight;
  const pct = docHeight > 0 ? Math.min((scrollTop / docHeight) * 100, 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';

  // Scroll depth tracking — fire once per threshold per surah
  const thresholds = [25, 50, 75, 100];
  thresholds.forEach(t => {
    const key = `scroll_${currentSurah.number}_${t}`;
    if (pct >= t && !sessionStorage.getItem(key)) {
      sessionStorage.setItem(key, '1');
      gtag('event', 'scroll_depth', {
        surah_number: currentSurah.number,
        surah_name: currentSurah.name,
        depth_percent: t
      });
    }
  });

  // Section visibility tracking — fire when each section enters viewport
  document.querySelectorAll('.section-block').forEach(el => {
    const sectionId = el.dataset.sectionId;
    if (!sectionId) return;
    const key = `section_viewed_${sectionId}`;
    if (sessionStorage.getItem(key)) return;
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight * 0.8) {
      sessionStorage.setItem(key, '1');
      trackSectionView();
      gtag('event', 'section_viewed', {
        surah_number: currentSurah.number,
        surah_name: currentSurah.name,
        section_id: sectionId
      });
    }
  });
});

renderSidebar();
renderMobileList();
updateStaticLabels();
setTimeout(showLangTooltipIfFirstVisit, 1500);

(async () => {
  try {
    currentSurah = await fetchSurahFromDB(SURAHS[0].number);
  } catch(e) {

  applyDisplaySettings();
  syncSidebarBtn();

  }
})();
