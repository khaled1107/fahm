[build]
  command = "chmod +x netlify_build.sh && ./netlify_build.sh"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/reader"
  to = "/reader.html"
  status = 200

[[redirects]]
  from = "/api/qf-auth"
  to = "/.netlify/functions/qf-auth"
  status = 200

[[redirects]]
  from = "/oauth/callback"
  to = "/.netlify/functions/qf-auth"
  status = 200

[[redirects]]
  from = "/api/track-section"
  to = "/.netlify/functions/track-section"
  status = 200
