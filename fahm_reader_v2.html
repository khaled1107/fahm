<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahm — Understand the Quran</title>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LNCECH8S39"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-LNCECH8S39');

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3ED;
    --cream-dark: #EDE8DF;
    --teal: #1D6A5C;
    --teal-light: #E8F3F0;
    --teal-mid: #2D8C78;
    --gold: #B8892A;
    --gold-light: #F5EDD8;
    --text-primary: #1C1C1A;
    --text-secondary: #5C574F;
    --text-muted: #9C9488;
    --border: rgba(92, 87, 79, 0.15);
    --border-strong: rgba(92, 87, 79, 0.25);
    --serif: 'Lora', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes shimmer {
    0%   { opacity: 1; }
    50%  { opacity: 0.4; }
    100% { opacity: 1; }
  }

  body {
    background: var(--cream);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── READING PROGRESS BAR ── */
  #progressBar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: var(--teal);
    z-index: 9999;
    transition: width 0.1s linear;
  }

  /* ── LAYOUT ── */
  .app { display: flex; min-height: 100vh; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 280px;
    height: 100vh;
    background: #F0EBE2;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    overflow-y: hidden;
    z-index: 100;
    transition: transform 0.25s;
  }
  .sidebar.collapsed { transform: translateX(-100%); }
  .main.sidebar-collapsed { margin-left: 0; }

  .sidebar-close-btn {
    display: flex;
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 36px;
    height: 36px;
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }

  .sidebar-header {
    padding: 2rem 1.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .logo {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: -0.01em;
  }

  .logo-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .sidebar-section-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 1.25rem 1.5rem 0.5rem;
  }

  .surah-list { padding: 0 0.75rem 2rem; flex: 1; overflow-y: auto; }

  .surah-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.45rem 0.75rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .surah-item:hover { background: rgba(29, 106, 92, 0.06); }
  .surah-item.active { background: var(--teal-light); }

  .surah-num {
    font-size: 0.7rem;
    color: var(--text-muted);
    min-width: 22px;
    font-variant-numeric: tabular-nums;
  }

  .surah-item.active .surah-num { color: var(--teal); }
  .surah-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }

  .surah-name {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }

  .surah-item.active .surah-name { color: var(--teal); }

  .surah-meta { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

  .surah-progress {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s;
    background: transparent;
  }

  .surah-progress.complete {
    background: var(--teal);
    border: 1.5px solid var(--teal);
  }

  .check-icon { width: 12px; height: 12px; stroke: white; stroke-width: 2.5; fill: none; }

  /* ── MAIN READER ── */
  .main {
    margin-left: 280px;
    flex: 1;
    max-width: 760px;
    padding: 0 2rem 6rem;
    margin-right: auto;
  }

  /* ── TOP NAV ── */
  .reader-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3rem;
    position: sticky;
    top: 0;
    background: var(--cream);
    z-index: 10;
  }

  .nav-breadcrumb { font-size: 0.8rem; color: var(--text-muted); }
  .nav-breadcrumb span { color: var(--text-secondary); font-weight: 500; }

  /* ── DISPLAY SETTINGS ── */
  .display-settings-wrap { position: relative; }

  .globe-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 10px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--cream);
    cursor: pointer;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .globe-btn:hover { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
  .globe-btn.active { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }

  .lang-tooltip {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 10px);
    background: var(--text-primary);
    color: white;
    font-size: 0.75rem;
    padding: 8px 12px;
    border-radius: 8px;
    white-space: nowrap;
    z-index: 300;
    pointer-events: none;
  }
  .lang-tooltip.visible { display: block; }
  .lang-tooltip-arrow {
    position: absolute;
    top: -5px;
    right: 14px;
    width: 10px;
    height: 10px;
    background: var(--text-primary);
    transform: rotate(45deg);
    border-radius: 2px;
  }

  .settings-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    width: 240px;
    background: white;
    border: 0.5px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px;
    z-index: 200;
  }
  .settings-dropdown.open { display: block; }

  .settings-label {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .settings-divider { height: 0.5px; background: var(--border); margin: 12px 0; }

  .lang-selector { display: flex; gap: 6px; margin-bottom: 4px; }
  .lang-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--border-strong);
    background: transparent;
    font-size: 0.78rem;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--sans);
  }
  .lang-option.active {
    background: var(--teal-light);
    border-color: var(--teal);
    color: var(--teal);
    font-weight: 500;
  }
  .lang-flag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em; }
  .lang-label { font-size: 0.78rem; }

  /* ── AUTH ── */
  .auth-nav-btn {
    display: flex; align-items: center; justify-content: center;
    height: 32px; padding: 0 12px;
    border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--cream); cursor: pointer;
    font-size: 0.75rem; font-weight: 500; color: var(--text-secondary);
    font-family: var(--sans); gap: 6px; flex-shrink: 0;
  }
  .auth-nav-btn:hover { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
  .auth-nav-btn.signed-in { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
  @media (max-width: 768px) {
    .auth-nav-btn { width: 32px; height: 32px; padding: 0; }
    .auth-nav-btn .auth-label { display: none; }
  }

  .streak-chip {
    display: none; align-items: center;
    height: 32px; padding: 0 9px; border-radius: 8px;
    background: var(--cream-dark);
    font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);
    letter-spacing: -0.01em; line-height: 1; white-space: nowrap;
    font-family: var(--sans); flex-shrink: 0;
  }
  .streak-chip.visible { display: flex; }

  .auth-overlay {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
  }
  .auth-overlay.open { display: flex; }

  .auth-modal {
    background: white; border-radius: 16px; padding: 2rem;
    width: 100%; max-width: 380px; margin: 1rem;
    position: relative;
  }
  .auth-modal-close {
    position: absolute; top: 1rem; right: 1rem;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px;
  }
  .auth-modal-title { font-size: 1.1rem; font-weight: 500; color: var(--text-primary); margin: 0 0 0.5rem; }
  .auth-modal-sub { font-size: 0.875rem; color: var(--text-muted); margin: 0 0 1.5rem; line-height: 1.5; }

  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 0.75rem; border-radius: 8px;
    border: 1px solid var(--border-strong); background: white;
    font-size: 0.875rem; font-weight: 500; color: var(--text-primary);
    cursor: pointer; font-family: var(--sans);
  }
  .google-btn:hover { background: var(--cream); }

  .auth-user-info { text-align: center; }
  .auth-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--teal-light); display: flex; align-items: center;
    justify-content: center; font-size: 1.1rem; font-weight: 500;
    color: var(--teal); margin: 0 auto 0.75rem;
  }
  .auth-user-name { font-size: 0.95rem; font-weight: 500; color: var(--text-primary); margin: 0 0 0.25rem; }
  .auth-user-email { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 1.25rem; }
  .auth-signout-btn {
    background: none; border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 0.5rem 1.25rem;
    font-size: 0.8rem; color: var(--text-muted); cursor: pointer;
    font-family: var(--sans);
  }
  .auth-signout-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }

  .engage-prompt {
    display: none; position: fixed; bottom: 5rem; right: 1.5rem;
    background: white; border: 0.5px solid var(--border-strong);
    border-radius: 12px; padding: 1rem 1.25rem; max-width: 260px;
    z-index: 400; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }
  .engage-prompt.visible { display: block; }
  .engage-close {
    position: absolute; top: 0.6rem; right: 0.6rem;
    background: none; border: none; cursor: pointer; color: var(--text-muted);
  }
  .engage-text { font-size: 0.85rem; color: var(--text-primary); margin: 0 0 0.75rem; line-height: 1.4; padding-right: 1rem; }
  .engage-cta {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 0.6rem; border-radius: 8px;
    background: var(--teal); color: white; border: none;
    font-size: 0.825rem; font-weight: 500; cursor: pointer; font-family: var(--sans);
  }
  .engage-cta:hover { background: var(--teal-mid); }

  /* ── FEEDBACK ── */
  .feedback-fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    transition: bottom 0.2s;
    z-index: 400;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    height: 36px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--sans);
  }
  .feedback-fab:hover { background: var(--teal-mid); }
  body.player-active .feedback-fab { bottom: 4.5rem; }

  .feedback-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
  }
  .feedback-overlay.open { display: flex; }

  .feedback-modal {
    background: white;
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    margin: 1rem;
    position: relative;
  }
  .feedback-modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
  }
  .feedback-title { font-size: 1.1rem; font-weight: 500; color: var(--text-primary); margin: 0 0 0.4rem; }
  .feedback-sub { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 1.25rem; line-height: 1.5; }

  .feedback-textarea {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 0.75rem;
    font-family: var(--sans);
    font-size: 0.875rem;
    color: var(--text-primary);
    background: white;
    resize: vertical;
    min-height: 120px;
    outline: none;
    line-height: 1.6;
    margin-bottom: 1rem;
  }
  .feedback-textarea:focus { border-color: var(--teal); }

  .feedback-optional { margin-bottom: 1.25rem; }
  .feedback-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .feedback-input {
    width: 100%;
    height: 36px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 0 12px;
    font-family: var(--sans);
    font-size: 0.875rem;
    color: var(--text-primary);
    background: white;
    outline: none;
  }
  .feedback-input:focus { border-color: var(--teal); }

  .feedback-submit {
    width: 100%;
    height: 40px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--sans);
  }
  .feedback-submit:hover { background: var(--teal-mid); }
  .feedback-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .feedback-success {
    text-align: center;
    padding: 1rem 0;
  }
  .feedback-success-icon {
    width: 48px; height: 48px;
    background: var(--teal-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    color: var(--teal);
  }

  @media (max-width: 768px) {
    .feedback-fab { display: none; }
  }

  .nav-feedback-btn {
    display: none;
  }
  @media (max-width: 768px) {
    .nav-feedback-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row-info { flex: 1; }
  .settings-row-name { font-size: 0.825rem; color: var(--text-primary); }
  .settings-row-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }

  .toggle-switch {
    width: 34px;
    height: 20px;
    border-radius: 10px;
    padding: 2px;
    display: flex;
    align-items: center;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 12px;
    transition: background 0.15s;
  }
  .toggle-switch.on { background: var(--teal); justify-content: flex-end; }
  .toggle-switch.off { background: #ccc; justify-content: flex-start; }
  .toggle-switch.locked { opacity: 0.4; cursor: not-allowed; }
  .toggle-thumb { width: 16px; height: 16px; background: white; border-radius: 50%; }

  /* bottom sheet (mobile) */
  .settings-sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.4);
  }
  .settings-sheet-overlay.open { display: block; }
  .settings-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-radius: 16px 16px 0 0;
    padding: 16px 20px 32px;
    z-index: 301;
    transform: translateY(100%);
    transition: transform 0.25s;
  }
  .settings-sheet-overlay.open .settings-sheet { transform: translateY(0); }
  .settings-sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
  .settings-sheet-title { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }

  /* verse transliteration layer */
  .verse-translit {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 8px;
    display: none;
    text-align: right;
    direction: ltr;
    unicode-bidi: plaintext;
  }
  .verse-secondary { display: none; margin-top: 6px; padding-top: 6px; border-top: 0.5px solid var(--border); font-size: 0.875rem; color: var(--text-secondary); }
  .verse-secondary-label { font-size: 0.68rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 3px; }
  .verse-translation { display: block; }
  .verse-bn-primary { display: none; font-size: 0.9375rem; line-height: 1.8; color: var(--text-primary); margin-top: 4px; }
  .verse-bn-secondary { display: none; margin-top: 6px; padding-top: 6px; border-top: 0.5px solid var(--border); font-size: 0.875rem; color: var(--text-secondary); }

  /* ── SURAH HEADER ── */
  .surah-header {
    text-align: center;
    padding: 1rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .surah-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.3rem 0.875rem;
    background: var(--teal-light);
    border-radius: 20px;
    font-size: 0.75rem;
    color: var(--teal);
    font-weight: 500;
    margin-bottom: 0.75rem;
    letter-spacing: 0.03em;
  }

  .surah-number-badge {
    width: 20px;
    height: 20px;
    background: var(--teal);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 500;
  }

  .surah-arabic-title {
    font-size: 2rem;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
    font-family: 'Scheherazade New', 'Traditional Arabic', serif;
    line-height: 1.4;
  }

  .surah-english-title {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 0.15rem;
    letter-spacing: -0.02em;
  }

  .surah-meaning {
    font-size: 0.875rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 1rem;
  }

  .surah-stats {
    display: flex;
    justify-content: center;
    gap: 2rem;
  }

  .stat { text-align: center; }

  .stat-value { font-size: 1.1rem; font-weight: 500; color: var(--text-primary); }
  .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .stat-divider { width: 1px; background: var(--border); align-self: stretch; }

  /* ── BISMILLAH ── */
  .bismillah {
    text-align: center;
    padding: 2rem 1rem 2.5rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }

  .bismillah-arabic {
    font-size: 1.75rem;
    line-height: 1.8;
    color: var(--text-primary);
    font-family: 'Scheherazade New', 'Traditional Arabic', serif;
    direction: rtl;
    margin-bottom: 0.5rem;
  }

  .bismillah-translation {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ── INTRODUCTION ── */
  .intro-block {
    background: var(--gold-light);
    border-left: 3px solid var(--gold);
    border-radius: 0 8px 8px 0;
    padding: 1.75rem 2rem;
    margin-bottom: 3.5rem;
  }

  .intro-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.875rem;

  /* ── SECTION ── */
  .section-block {
    margin-bottom: 4rem;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── SECTION HEADER WITH AUDIO ── */
  .section-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .section-eyebrow {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 0.25rem;
  }

  .section-title-group { flex: 1; }

  .section-title {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
  }

  .section-range { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  /* ── AUDIO PLAYER ── */
  .audio-player {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    align-items: flex-end;
  }

  .audio-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--teal);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    color: var(--teal);
  }

  .audio-btn:hover { background: var(--teal); color: white; }
  .audio-btn.playing { background: var(--teal); color: white; }

  .audio-progress-wrap {
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }

  .audio-progress-wrap.visible { display: block; }

  .audio-progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;

    border-radius: 2px;
  }

  /* ── MOBILE MINI PLAYER ── */
  #miniPlayer {
    position: fixed;
    bottom: 0; left: 0; right: 0;

  .mini-player-sub { font-size: 0.7rem; color: var(--text-muted); }

  .mini-player-bar {
    width: 100%;
    height: 2px;
    background: var(--border);

    bottom: 0; left: 0;

  .mini-player-fill {
    height: 100%;

    width: 0%;

  .mini-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--teal);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;

  /* ── CONNECTION ── */
  .connection-block {
    padding: 0.875rem 1rem;
    background: var(--cream-dark);
    border-radius: 8px;
    margin-bottom: 1.25rem;
  }

  .connection-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);

    display: flex;
    align-items: center;
    gap: 6px;

  .connection-body {
    font-size: 0.9375rem;
    color: var(--text-secondary);
    line-height: 1.75;
  }

  .connection-icon { width: 12px; height: 12px; stroke: var(--text-muted); stroke-width: 2; fill: none; }

  /* ── BRIDGE ── */
  .bridge-block {
    padding: 1.25rem 1.5rem;
    background: var(--teal-light);
    border-left: 3px solid var(--teal-mid);
    border-radius: 0 8px 8px 0;
    margin-bottom: 1.25rem;

  .bridge-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal-mid);
    margin-bottom: 0.5rem;
  }

  .bridge-text { font-size: 0.9375rem; color: var(--text-primary); line-height: 1.75; }

  /* ── REVELATION CONTEXT ── */
  .context-block {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 0.875rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1.5rem;

  .context-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 3px;

    border: 1px solid var(--border);

    margin-bottom: 1rem;

  .verse-row {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1rem;
    align-items: start;

  .verse-row:last-child { border-bottom: none; }

  .verse-row.playing {
    background: var(--teal-light);
    transition: background 0.3s ease;

  .verse-arabic {

  .verse-translation {
    font-size: 0.9375rem;
    line-height: 1.8;
    color: var(--text-primary);

  .verse-secondary-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 3px;

    align-items: center;
    gap: 1rem;
    margin: 3rem 0;

  .section-divider-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }

  .mark-complete-btn.done {

  }

  .completion-message {
    margin-top: 1.25rem;
    font-size: 0.9375rem;
    color: var(--text-secondary);

  .next-btn {

    align-items: center;
    gap: 6px;
    margin-top: 1.25rem;

    border-radius: 8px;
    font-family: var(--sans);
    font-size: 0.875rem;

  .next-btn.visible { display: inline-flex; }

      font-size: 0.875rem;

  }

  /* Hide mobile screens on desktop */
  @media (min-width: 769px) {
    #mobileListScreen { display: none !important; }
    #mobileReader { display: block !important; }

</style>
</head>

<script>
const REVELATION_PERIOD = {
  makki_early: 'Makkan · Early',
  makki_mid: 'Makkan · Middle',
  makki_late: 'Makkan · Late',
  madani_early: 'Early Madinan',
  madani_late: 'Late Madinan',
};

function getRevelationPeriod(surahNum, type) {
  if (type === 'Madani') {
    return surahNum <= 9 ? 'Early Madinan' : 'Late Madinan';
  }
  if (surahNum >= 87) return 'Early Makkan';
  if (surahNum >= 50) return 'Middle Makkan';
  return 'Late Makkan';
}

// ── SUPABASE CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://wdpuabsupdvtgbywzvue.supabase.co';
const SUPABASE_ANON_KEY = '{{SUPABASE_ANON_KEY}}';
const SB_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json'
};

async function sbFetch(endpoint) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, { headers: SB_HEADERS });
  if (!r.ok) throw new Error(`Supabase error: ${r.status}`);
  return r.json();
}

// Lightweight surah list — just metadata for sidebar/list rendering
// Full content (sections, verses) is fetched on demand per surah
const SURAHS = [
  { number: 1,   name: "Al-Fatihah",     arabic: "الفاتحة",      meaning: "The Opening",              verses: 7,   type: "Makki" },

  { number: 8,   name: "Al-Anfal",       arabic: "الأنفال",      meaning: "The Spoils of War",        verses: 75,  type: "Madani" },
  { number: 9,   name: "At-Tawbah",      arabic: "التوبة",       meaning: "The Repentance",           verses: 129, type: "Madani" },
  { number: 10,  name: "Yunus",          arabic: "يونس",         meaning: "Jonah",                    verses: 109, type: "Makki" },
  { number: 11,  name: "Hud",            arabic: "هود",          meaning: "Hud",                      verses: 123, type: "Makki" },
  { number: 12,  name: "Yusuf",          arabic: "يوسف",         meaning: "Joseph",                   verses: 111, type: "Makki" },
  { number: 13,  name: "Ar-Ra'd",        arabic: "الرعد",        meaning: "The Thunder",              verses: 43,  type: "Madani" },
  { number: 14,  name: "Ibrahim",        arabic: "إبراهيم",      meaning: "Abraham",                  verses: 52,  type: "Makki" },

// In-memory cache for fully loaded surahs
const surahCache = {};

async function fetchSurahFromDB(num) {
  if (surahCache[num]) return surahCache[num];

  // Fetch surah metadata + introductions
  const [surahRows, sectionRows, verseRows] = await Promise.all([
    sbFetch(`fahm_surahs?number=eq.${num}&select=*`),
    sbFetch(`fahm_sections?surah_number=eq.${num}&select=*&order=section_number.asc`),
    sbFetch(`fahm_verses?surah_number=eq.${num}&select=*&order=verse_number.asc`)
  ]);

  const surahMeta = SURAHS.find(s => s.number === num) || {};
  const dbSurah = surahRows[0] || {};

  // Index verses by verse_key
  const verseIndex = {};
  for (const v of verseRows) verseIndex[v.verse_key] = v;

  const sections = sectionRows.map(sec => {
    const keys = sec.verse_keys || [];
    return {
      num:        sec.section_number,
      title:      sec.title_en || '',
      title_bn:   sec.title_bn || '',
      range:      sec.verse_range || '',
      keys:       keys,
      context:    sec.context_en || '',
      context_bn: sec.context_bn || '',
      bridge:     sec.bridge_en || '',
      bridge_bn:  sec.bridge_bn || '',
      arabic:       keys.map(k => verseIndex[k]?.arabic || ''),
      translation:  keys.map(k => verseIndex[k]?.abdel_haleem || ''),
      sahih:        keys.map(k => verseIndex[k]?.sahih_international || ''),
      translit:     keys.map(k => verseIndex[k]?.transliteration || ''),
      bn_taisirul:  keys.map(k => verseIndex[k]?.bn_taisirul || ''),
      bn_rawai:     keys.map(k => verseIndex[k]?.bn_rawai || ''),
    };
  });

  const full = Object.assign({}, surahMeta, {
    introduction:    dbSurah.introduction_en || '',
    introduction_bn: dbSurah.introduction_bn || '',
    sections,
  });

  surahCache[num] = full;
  return full;
}

let currentSurah = SURAHS[0];
let completedSurahs = new Set(JSON.parse(localStorage.getItem('fahm_completed') || '[]'));

function saveCompleted() {
  localStorage.setItem('fahm_completed', JSON.stringify([...completedSurahs]));
}

function isComplete(num) {
  return completedSurahs.has(num);
}

function toBengaliNumerals(str) {
  const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  return String(str).replace(/[0-9]/g, d => map[d]);
}

function num(n) {
  return langPrefs.lang === 'bn' ? toBengaliNumerals(n) : String(n);
}

function verseRange(range) {
  return langPrefs.lang === 'bn' ? toBengaliNumerals(range) : range;
}

function verseKey(key) {
  return langPrefs.lang === 'bn' ? toBengaliNumerals(key) : key;
}

function getRevelationPeriodLabel(surahNum, type) {
  const isBn = langPrefs.lang === 'bn';
  if (type === 'Madani') return isBn ? 'মাদানী' : 'Madani';
  return isBn ? 'মক্কী' : 'Makki';
}

for (let i = 0; i < VERSE_COUNTS_ARR.length; i++) {
  SURAH_OFFSETS.push(_running);
  _running += VERSE_COUNTS_ARR[i];
}
// Total so far covers surahs 1-114 (partial if array is short)

function getAbsoluteVerseNum(surahNum, verseNum) {
  if (surahNum < 1 || surahNum > SURAH_OFFSETS.length) return null;
  return SURAH_OFFSETS[surahNum - 1] + verseNum;
}

function getVerseAudioUrl(surahNum, verseNum) {
  const s = String(surahNum).padStart(3, '0');
  const v = String(verseNum).padStart(3, '0');
  return `https://verses.quran.foundation/Shatri/mp3/${s}${v}.mp3`;
}

// Chapter-level audio fetched live from the QF Content API.
// Falls back to per-verse CDN URLs if the fetch fails.
let currentChapterAudioUrl   = null;
let currentChapterAudioSurah = null;

async function fetchChapterAudio(surahNum) {
  currentChapterAudioUrl   = null;
  currentChapterAudioSurah = null;
  try {
    const r = await fetch(`https://api.quran.com/api/v4/chapter_recitations/6/${surahNum}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const url = data?.audio_file?.audio_url;
    if (!url) throw new Error('No audio_url in response');
    currentChapterAudioUrl   = url;
    currentChapterAudioSurah = surahNum;
    console.log('[audio] QF chapter audio ready for surah %d → %s', surahNum, url);
  } catch (e) {
    console.warn('[audio] QF chapter audio fetch failed, per-verse fallback active:', e.message);
  }
}

function fmtTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// Active playback state
let audioQueue = [];       // [{surahNum, verseNum, verseKey}, ...]
let audioQueueIndex = 0;
let activeAudio = null;
let activeAudioSectionId = null;
let isAudioPaused = false;

function clearVerseHighlights() {
  document.querySelectorAll('.verse-row.playing').forEach(el => el.classList.remove('playing'));
}

function highlightVerse(verseKey) {
  clearVerseHighlights();
  const safeKey = verseKey.replace(':', '-');
  let targetRow = null;
  document.querySelectorAll('.verse-row').forEach(row => {
    if (row.dataset.verseKey === safeKey) {
      row.classList.add('playing');
      targetRow = row;
    }
  });

  if (targetRow) {
    const rect = targetRow.getBoundingClientRect();
    const viewportH = window.innerHeight;
    // Target position: 33% from top of viewport
    const targetTop = viewportH * 0.33;
    const scrollDelta = rect.top - targetTop;
    window.scrollBy({ top: scrollDelta, behavior: 'smooth' });
  }
}

function updateSectionProgress(btnId, progressId, current, total) {
  const pct = total > 0 ? (current / total) * 100 : 0;
  const fill = document.querySelector(`#${progressId} .audio-progress-fill`);
  if (fill) fill.style.width = pct + '%';
  document.getElementById('miniProgressFill').style.width = pct + '%';
}

// Single reusable audio element — mobile browsers allow src changes
// within the same playback chain without requiring a new user gesture
const sharedAudio = new Audio();
sharedAudio.preload = 'auto';

function playQueue(btnId, progressId, sectionTitle) {
  if (audioQueueIndex >= audioQueue.length) {
    clearVerseHighlights();
    const btn = document.getElementById(btnId);
    if (btn) { btn.classList.remove('playing'); btn.innerHTML = playIcon(); }
    const wrap = document.getElementById(progressId);
    if (wrap) { wrap.classList.remove('visible'); wrap.querySelector('.audio-progress-fill').style.width = '0%'; }
    document.getElementById('miniPlayer').classList.remove('visible');
    document.body.classList.remove('player-active');
    activeAudio = null;
    activeAudioSectionId = null;
    isAudioPaused = false;
    return;
  }

  const { surahNum, verseNum, verseKey } = audioQueue[audioQueueIndex];
  highlightVerse(verseKey);
  updateSectionProgress(btnId, progressId, audioQueueIndex, audioQueue.length);
  updateMiniPlayer(true, sectionTitle, audioQueueIndex + 1, audioQueue.length);

  sharedAudio.onended = null;
  sharedAudio.onerror = null;
  sharedAudio.src = getVerseAudioUrl(surahNum, verseNum);
  activeAudio = sharedAudio;

  sharedAudio.onended = () => {
    audioQueueIndex++;
    playQueue(btnId, progressId, sectionTitle);
  };

  sharedAudio.onerror = () => {
    audioQueueIndex++;
    playQueue(btnId, progressId, sectionTitle);
  };

  sharedAudio.play().catch(() => {
    audioQueueIndex++;
    playQueue(btnId, progressId, sectionTitle);
  });
}

function renderSidebar() {
  const list = document.getElementById('surahList');
  list.innerHTML = SURAHS.map(s => {
    const done = isComplete(s.number);
    return `
    <button class="surah-item ${s.number === currentSurah.number ? 'active' : ''}" onclick="closeSidebar(); loadSurah(${s.number})">
      <span class="surah-num">${s.number}</span>
      <span class="surah-info">
        <span class="surah-name">${s.name}</span>
        <span class="surah-meta">${num(s.verses)} · ${langPrefs.lang === 'bn' ? (s.type === 'Madani' ? 'মাদানী' : 'মক্কী') : s.type}</span>
      </span>
      <span class="surah-progress ${done ? 'complete' : ''}" id="progress-${s.number}">
        ${done ? `<svg class="check-icon" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>` : ''}
      </span>
    </button>`}).join('');
}

let surahEntryTime = Date.now();

async function loadSurah(num) {
  // Track time spent on previous surah before switching
  const timeSpent = Math.round((Date.now() - surahEntryTime) / 1000);
  if (timeSpent > 3) {
    gtag('event', 'time_on_surah', {
      surah_number: currentSurah.number,
      surah_name: currentSurah.name,
      seconds: timeSpent
    });
  }
  surahEntryTime = Date.now();

  stopAudio();

  // Set lightweight metadata immediately so sidebar highlights correctly
  currentSurah = SURAHS.find(s => s.number === num) || currentSurah;
  renderSidebar();

  // Show loading state in reader
  const content = document.getElementById('readerContent');
  if (content) content.innerHTML = `
    <div style="padding: 3rem 0; display:flex; flex-direction:column; gap: 1.5rem;">
      <div style="height: 20px; background: var(--cream-dark); border-radius: 4px; width: 40%; margin: 0 auto; animation: shimmer 1.2s infinite;"></div>
      <div style="height: 60px; background: var(--cream-dark); border-radius: 4px; width: 60%; margin: 0 auto; animation: shimmer 1.2s infinite 0.1s;"></div>
      <div style="height: 16px; background: var(--cream-dark); border-radius: 4px; width: 30%; margin: 0 auto; animation: shimmer 1.2s infinite 0.2s;"></div>
      <div style="height: 80px; background: var(--cream-dark); border-radius: 4px; margin-top: 1rem; animation: shimmer 1.2s infinite 0.3s;"></div>
      <div style="height: 16px; background: var(--cream-dark); border-radius: 4px; animation: shimmer 1.2s infinite 0.4s;"></div>
      <div style="height: 16px; background: var(--cream-dark); border-radius: 4px; width: 85%; animation: shimmer 1.2s infinite 0.5s;"></div>
      <div style="height: 16px; background: var(--cream-dark); border-radius: 4px; width: 90%; animation: shimmer 1.2s infinite 0.6s;"></div>
    </div>`;

  if (isMobile()) showMobileReader();

  try {
    currentSurah = await fetchSurahFromDB(num);
  } catch(e) {
    console.error('Failed to load surah:', e);
    if (content) content.innerHTML = `
      <div style="text-align:center; padding: 4rem 2rem; color: var(--text-muted);">
        <div style="font-size:0.875rem;">Failed to load surah. Please check your connection and try again.</div>
      </div>`;
    return;
  }

  renderSidebar();
  renderReader();
  applyDisplaySettings();
  syncSidebarBtn();
  window.scrollTo(0, 0);
  if (!isMobile()) {
    document.getElementById('sidebar').classList.remove('open');
  }
  gtag('event', 'surah_open', {
    surah_number: currentSurah.number,
    surah_name: currentSurah.name
  });

  fetchChapterAudio(currentSurah.number);   // fire-and-forget — visible in network tab
  startActivityDayTimer(currentSurah.number);
}

function stopAudio() {
  sharedAudio.onended     = null;
  sharedAudio.onerror     = null;
  sharedAudio.ontimeupdate = null;
  sharedAudio.pause();
  sharedAudio.src = '';
  activeAudio = null;
  clearVerseHighlights();
  audioQueue = [];
  audioQueueIndex = 0;
  activeAudioSectionId = null;
  isAudioPaused = false;
  document.getElementById('miniPlayer').classList.remove('visible');
  document.querySelectorAll('.audio-btn').forEach(b => { b.classList.remove('playing'); b.innerHTML = playIcon(); });
  document.querySelectorAll('.audio-progress-wrap').forEach(w => { w.classList.remove('visible'); });
}

function toggleAudio(surahNum, sectionNum, sectionTitle, btnId, progressId, verseKeys) {
  const sectionId = `${surahNum}-${sectionNum}`;
  const btn = document.getElementById(btnId);
  const progressWrap = document.getElementById(progressId);

  // ── QF chapter audio (single file, fetched live from api.quran.com) ────────
  if (currentChapterAudioUrl && currentChapterAudioSurah === surahNum) {
    if (activeAudio && activeAudioSectionId) {
      // Audio already loaded — toggle play/pause from whichever button was pressed.
      if (activeAudio.paused) {
        activeAudio.play().catch(() => {});
        isAudioPaused = false;
        btn.classList.add('playing');
        btn.innerHTML = pauseIcon();
        // Move "active" marker to this button if the user clicked a different section.
        if (activeAudioSectionId !== sectionId) {
          const [ps, pn] = activeAudioSectionId.split('-');
          const prevBtn = document.getElementById(`audio-btn-${ps}-${pn}`);
          if (prevBtn) { prevBtn.classList.remove('playing'); prevBtn.innerHTML = playIcon(); }
          activeAudioSectionId = sectionId;
        }
        updateMiniPlayer(true, `${currentSurah.name} · Abu Bakr al-Shatri`, null, null);
      } else {
        activeAudio.pause();
        isAudioPaused = true;
        btn.classList.remove('playing');
        btn.innerHTML = playIcon();
        updateMiniPlayer(false, `${currentSurah.name} · Abu Bakr al-Shatri`, null, null);
      }
      return;
    }

    // First play — load and start chapter audio.
    stopAudio();
    activeAudioSectionId = sectionId;
    btn.classList.add('playing');
    btn.innerHTML = pauseIcon();
    progressWrap && progressWrap.classList.add('visible');

    sharedAudio.src = currentChapterAudioUrl;
    activeAudio = sharedAudio;

    sharedAudio.ontimeupdate = () => {
      if (!sharedAudio.duration) return;
      const pct = (sharedAudio.currentTime / sharedAudio.duration) * 100;
      const fill = document.querySelector(`#${progressId} .audio-progress-fill`);
      if (fill) fill.style.width = pct + '%';
      document.getElementById('miniProgressFill').style.width = pct + '%';
      const sub = document.getElementById('miniSub');
      if (sub) sub.textContent =
        `${fmtTime(sharedAudio.currentTime)} / ${fmtTime(sharedAudio.duration)} · Abu Bakr al-Shatri`;
    };

    sharedAudio.onended = () => {
      clearVerseHighlights();
      document.querySelectorAll('.audio-btn.playing').forEach(b => {
        b.classList.remove('playing'); b.innerHTML = playIcon();
      });
      document.querySelectorAll('.audio-progress-wrap.visible').forEach(w => {
        w.classList.remove('visible');
        const fill = w.querySelector('.audio-progress-fill');
        if (fill) fill.style.width = '0%';
      });
      document.getElementById('miniPlayer').classList.remove('visible');
      document.body.classList.remove('player-active');
      activeAudio = null; activeAudioSectionId = null; isAudioPaused = false;
    };

    sharedAudio.onerror = () => {
      console.warn('[audio] Chapter audio error, falling back to per-verse');
      currentChapterAudioUrl = null;
      stopAudio();
      toggleAudio(surahNum, sectionNum, sectionTitle, btnId, progressId, verseKeys);
    };

    updateMiniPlayer(true, `${currentSurah.name} · Abu Bakr al-Shatri`, null, null);
    sharedAudio.play().catch(e => console.warn('[audio] chapter play() rejected:', e.message));
    console.log('[audio] playing QF chapter audio, surah=%d url=%s', surahNum, currentChapterAudioUrl);
    gtag('event', 'audio_play', {
      surah_number: surahNum, surah_name: currentSurah.name,
      section_title: sectionTitle, audio_source: 'qf_chapter_api'
    });
    return;
  }

  // ── Per-verse fallback (CDN) ──────────────────────────────────────────────
  const isSameSection = activeAudioSectionId === sectionId;
  if (isSameSection && activeAudio) {
    if (activeAudio.paused) {
      activeAudio.play();
      isAudioPaused = false;
      btn.classList.add('playing');
      btn.innerHTML = pauseIcon();
      updateMiniPlayer(true, sectionTitle, audioQueueIndex + 1, audioQueue.length);
    } else {
      activeAudio.pause();
      isAudioPaused = true;
      btn.classList.remove('playing');
      btn.innerHTML = playIcon();
      updateMiniPlayer(false, sectionTitle, audioQueueIndex + 1, audioQueue.length);
    }
    return;
  }

  stopAudio();
  audioQueue = verseKeys.map(vk => {
    const [s, v] = vk.split(':');
    return { surahNum: parseInt(s), verseNum: parseInt(v), verseKey: vk };
  });
  audioQueueIndex = 0;
  activeAudioSectionId = sectionId;
  btn.classList.add('playing');
  btn.innerHTML = pauseIcon();
  progressWrap && progressWrap.classList.add('visible');

  gtag('event', 'audio_play', {
    surah_number: surahNum, surah_name: currentSurah.name,
    section_title: sectionTitle, audio_source: 'per_verse_cdn'
  });
  playQueue(btnId, progressId, sectionTitle);
}

function toggleMiniPlay() {
  if (!activeAudio || !activeAudioSectionId) return;
  // Find the active section's btn and progressId
  const [surahNum, sectionNum] = activeAudioSectionId.split('-');
  const btnId = `audio-btn-${surahNum}-${sectionNum}`;
  const progressId = `audio-prog-${surahNum}-${sectionNum}`;
  const sectionTitle = document.getElementById('miniTitle').textContent;

  if (activeAudio.paused) {
    activeAudio.play();
    isAudioPaused = false;
    document.getElementById(btnId) && (document.getElementById(btnId).innerHTML = pauseIcon());
    document.getElementById(btnId) && document.getElementById(btnId).classList.add('playing');
    document.getElementById('miniPlayIcon').outerHTML = `<svg id="miniPlayIcon" width="16" height="16" viewBox="0 0 16 16" fill="white"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>`;
  } else {
    activeAudio.pause();
    isAudioPaused = true;
    document.getElementById(btnId) && (document.getElementById(btnId).innerHTML = playIcon());
    document.getElementById(btnId) && document.getElementById(btnId).classList.remove('playing');
    document.getElementById('miniPlayIcon').outerHTML = `<svg id="miniPlayIcon" width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="4,2 14,8 4,14"/></svg>`;
  }
}

function updateMiniPlayer(playing, title, current, total) {
  document.getElementById('miniTitle').textContent = title;
  const sub = document.getElementById('miniSub');
  if (sub && current && total) sub.textContent = `Verse ${current} of ${total} · Abu Bakr al-Shatri`;
  document.getElementById('miniPlayer').classList.add('visible');
  document.body.classList.add('player-active');
  const iconEl = document.getElementById('miniPlayIcon');
  if (iconEl) iconEl.outerHTML = playing
    ? `<svg id="miniPlayIcon" width="16" height="16" viewBox="0 0 16 16" fill="white"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>`
    : `<svg id="miniPlayIcon" width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="4,2 14,8 4,14"/></svg>`;
}

function playIcon() {
  return `<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><polygon points="3,1 13,7 3,13"/></svg>`;
}

function pauseIcon() {
  return `<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="4" height="12" rx="1"/><rect x="8" y="1" width="4" height="12" rx="1"/></svg>`;
}


function markComplete(num) {
  completedSurahs.add(num);
  saveCompleted();
  const surah = SURAHS.find(s => s.number === num);
  gtag('event', 'surah_complete', {
    surah_number: num,
    surah_name: surah ? surah.name : ''
  });

  // Sync to DB if signed in, otherwise prompt sign-in
  if (currentUser) {
    syncProgressToDB(num);
  } else if (!sessionStorage.getItem('fahm_engage_dismissed')) {
    setTimeout(() => showAuthModal('prompt'), 800);
  }

  const btn = document.getElementById('markCompleteBtn');
  if (btn) {
    btn.classList.add('done');
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2.5"><polyline points="2,8 6,12 14,4"/></svg> Completed`;
  }

  const msg = document.getElementById('completionMsg');
  if (msg) msg.classList.add('visible');

  const nextBtn = document.getElementById('nextSurahBtn');
  if (nextBtn) nextBtn.classList.add('visible');

  const progressCircle = document.getElementById('progress-' + num);
  if (progressCircle) {
    progressCircle.classList.add('complete');
    progressCircle.innerHTML = `<svg class="check-icon" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>`;
  }
}

function nextSurah() {
  const idx = SURAHS.findIndex(s => s.number === currentSurah.number);
  if (idx < SURAHS.length - 1) loadSurah(SURAHS[idx + 1].number);
}

// ── LANGUAGE & DISPLAY SETTINGS ──
const LANG_DEFS = {
  en: {
    label: 'English',
    flag: 'EN',
    verse_toggles: [
      { key: 'translit', label: 'Transliteration',        sub: null,                  locked: false, default: false },
      { key: 'abdel',    label: 'English translation',     sub: 'Abdel Haleem',         locked: false, default: true  },
      { key: 'sahih',    label: 'English translation',     sub: 'Sahih International',  locked: false, default: false },
    ]
  },
  bn: {
    label: 'বাংলা',
    flag: 'BN',
    verse_toggles: [
      { key: 'translit', label: 'Transliteration',        sub: null,                  locked: false, default: false },
      { key: 'bn_taisirul', label: 'বাংলা অনুবাদ',        sub: 'তাইসিরুল কুরআন',      locked: false, default: true  },
      { key: 'bn_rawai',    label: 'বাংলা অনুবাদ',        sub: 'রাওয়াই আল-বায়ান',     locked: false, default: false },
    ]
  }
};

function loadLangPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem('fahm_lang_prefs') || '{}');
    const prefs = { lang: 'en', toggles: {} };
    prefs.lang = saved.lang || 'en';
    // Build toggle state from saved or defaults
    for (const [lang, def] of Object.entries(LANG_DEFS)) {
      prefs.toggles[lang] = {};
      for (const t of def.verse_toggles) {
        prefs.toggles[lang][t.key] = saved.toggles?.[lang]?.[t.key] ?? t.default;
      }
    }
    return prefs;
  } catch(e) {
    return buildDefaultPrefs();
  }
}

function buildDefaultPrefs() {
  const prefs = { lang: 'en', toggles: {} };
  for (const [lang, def] of Object.entries(LANG_DEFS)) {
    prefs.toggles[lang] = {};
    for (const t of def.verse_toggles) {
      prefs.toggles[lang][t.key] = t.default;
    }
  }
  return prefs;
}

function saveLangPrefs() {
  localStorage.setItem('fahm_lang_prefs', JSON.stringify(langPrefs));
}

let langPrefs = loadLangPrefs();

function currentLang() { return LANG_DEFS[langPrefs.lang]; }
function currentToggles() { return langPrefs.toggles[langPrefs.lang]; }

function settingsPanelHTML() {
  const lang = langPrefs.lang;
  const toggles = currentToggles();
  const langDef = currentLang();

  // Language selector row
  const langRows = Object.entries(LANG_DEFS).map(([code, def]) => {
    const isActive = code === lang;
    return `<button class="lang-option ${isActive ? 'active' : ''}" onclick="switchLang('${code}')">
      <span class="lang-label">${def.label}</span>
      ${isActive ? `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>` : ''}
    </button>`;
  }).join('');

  // Arabic row (always locked on)
  const arabicRow = `
    <div class="settings-row">
      <div class="settings-row-info"><div class="settings-row-name">Arabic text</div></div>
      <div class="toggle-switch on locked"><div class="toggle-thumb"></div></div>
    </div>`;

  // Verse toggle rows for current language
  const toggleRows = langDef.verse_toggles.map(t => {
    const isOn = toggles[t.key] ?? t.default;
    const isDisabled = t.disabled || false;
    const lockedClass = isDisabled ? ' locked' : '';
    const clickAttr = isDisabled ? '' : `onclick="toggleVerseLayer('${t.key}')"`;
    return `
    <div class="settings-row">
      <div class="settings-row-info">
        <div class="settings-row-name">${t.label}${isDisabled ? ' <span style="font-size:0.65rem;color:var(--text-muted);">soon</span>' : ''}</div>
        ${t.sub ? `<div class="settings-row-sub">${t.sub}</div>` : ''}
      </div>
      <div class="toggle-switch ${isOn ? 'on' : 'off'}${lockedClass}" ${clickAttr}>
        <div class="toggle-thumb"></div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="settings-label">Language</div>
    <div class="lang-selector">${langRows}</div>
    <div class="settings-divider"></div>
    <div class="settings-label">Verse display</div>
    ${arabicRow}
    ${toggleRows}`;
}

function renderSettingsRows() {
  const html = settingsPanelHTML();
  const dropdown = document.getElementById('settingsDropdown');
  const sheet = document.getElementById('settingsSheetRows');
  if (dropdown) dropdown.innerHTML = html;
  if (sheet) sheet.innerHTML = html;
}

function switchLang(code) {
  langPrefs.lang = code;
  saveLangPrefs();
  updateGlobeLabel();
  updateStaticLabels();
  renderSettingsRows();
  renderSidebar();
  renderMobileList();
  renderReader();
  applyDisplaySettings();
  syncSidebarBtn();
}

function updateStaticLabels() {
  const el = (id) => document.getElementById(id);
  if (el('sidebarLabel'))    el('sidebarLabel').textContent    = t('juzAmma');
  if (el('mobileListLabel')) el('mobileListLabel').textContent = t('juzAmma');
}

function toggleVerseLayer(key) {
  langPrefs.toggles[langPrefs.lang][key] = !langPrefs.toggles[langPrefs.lang][key];
  saveLangPrefs();
  renderSettingsRows();
  applyDisplaySettings();
}

function applyDisplaySettings() {
  const toggles = currentToggles();
  const isBn = langPrefs.lang === 'bn';

  document.querySelectorAll('.verse-translit').forEach(el => {
    el.style.display = toggles.translit ? 'block' : 'none';
  });
  document.querySelectorAll('.verse-translation').forEach(el => {
    el.style.display = (!isBn && toggles.abdel) ? 'block' : 'none';
  });
  document.querySelectorAll('.verse-secondary').forEach(el => {
    el.style.display = (!isBn && toggles.sahih) ? 'block' : 'none';
  });
  document.querySelectorAll('.verse-bn-primary').forEach(el => {
    el.style.display = (isBn && toggles.bn_taisirul) ? 'block' : 'none';
  });
  document.querySelectorAll('.verse-bn-secondary').forEach(el => {
    el.style.display = (isBn && toggles.bn_rawai) ? 'block' : 'none';
  });
}

function toggleSettingsPanel() {
  const mobile = window.innerWidth <= 768;
  // Dismiss tooltip
  const tooltip = document.getElementById('langTooltip');
  if (tooltip) { tooltip.classList.remove('visible'); localStorage.setItem('fahm_lang_tooltip_seen', '1'); }
  if (mobile) {
    renderSettingsRows();
    document.getElementById('settingsSheetOverlay').classList.toggle('open');

// Initialise Supabase auth using the REST API + GoTrue
const GOTRUE_URL = `${SUPABASE_URL}/auth/v1`;

async function getSession() {
  const stored = localStorage.getItem('fahm_session');
  if (!stored) return null;
  try {
    const session = JSON.parse(stored);
    // Check expiry
    if (session.expires_at && Date.now() / 1000 > session.expires_at - 60) {
      // Refresh token
      const r = await fetch(`${GOTRUE_URL}/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!r.ok) { localStorage.removeItem('fahm_session'); return null; }
      const data = await r.json();
      localStorage.setItem('fahm_session', JSON.stringify(data));
      return data;
    }
    return session;
  } catch(e) { return null; }
}

async function signInWithGoogle() {
  const redirectTo = encodeURIComponent(window.location.origin + window.location.pathname);
  const url = `${GOTRUE_URL}/authorize?provider=google&redirect_to=${redirectTo}`;

}

function base64urlToString(b64u) {
  const pad = '='.repeat((4 - (b64u.length % 4)) % 4);
  const b64 = (b64u + pad).replace(/-/g, '+').replace(/_/g, '/');
  try { return decodeURIComponent(escape(atob(b64))); } catch { return atob(b64); }
}

async function getQFSession() {
  const stored = localStorage.getItem('fahm_qf_session');
  if (!stored) return null;
  try {
    const session = JSON.parse(stored);
    if (session.expires_at && Date.now() / 1000 > session.expires_at - 60) {
      if (!session.refresh_token) { localStorage.removeItem('fahm_qf_session'); return null; }
      const r = await fetch('/api/qf-auth?action=refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!r.ok) { localStorage.removeItem('fahm_qf_session'); return null; }
      const t = await r.json();
      session.access_token  = t.access_token  || session.access_token;
      session.refresh_token = t.refresh_token || session.refresh_token;
      session.expires_at    = Math.floor(Date.now() / 1000) + (t.expires_in || 3600);
      localStorage.setItem('fahm_qf_session', JSON.stringify(session));
    }
    return session;
  } catch { return null; }
}

function normalizeQFUser(rawUser, fallbackSub) {
  const u = rawUser || {};
  const fullName = u.name || [u.given_name, u.family_name].filter(Boolean).join(' ').trim() || u.preferred_username || u.email || 'QF User';
  return {
    id: u.sub || fallbackSub || '',
    email: u.email || '',
    user_metadata: { full_name: fullName, avatar_url: u.picture || '' },
    _provider: 'qf'
  };
}

function isQFGenericUser(user) {
  if (!user || user._provider !== 'qf') return false;
  const name = (user.user_metadata?.full_name || '').trim();
  return !name || name === 'QF User';
}

}

async function handleAuthCallback() {
  // Parse hash params from OAuth redirect
  const hash = window.location.hash;
  if (!hash || hash.length < 2) return;
  const params = new URLSearchParams(hash.replace('#', ''));

  // ── QF callback ─────────────────────────────────────────
  if (params.get('qf_access_token') || params.get('qf_error')) {
    if (params.get('qf_error')) {
      console.warn('QF sign-in error:', params.get('qf_error'));
      history.replaceState(null, '', window.location.pathname);
      return;
    }
    let rawUser = null;
    const uEnc = params.get('qf_user');
    if (uEnc) {
      try { rawUser = JSON.parse(base64urlToString(uEnc)); } catch {}
    }
    // Decode the JWT sub from the access token as a guaranteed fallback for user id.
    // normalizeQFUser uses sub||fallbackSub, so this covers the case where userinfo
    // was empty or unavailable during the OAuth callback.
    let jwtSub = '';
    try {
      const parts = (params.get('qf_access_token') || '').split('.');
      if (parts.length === 3) {
        const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
        jwtSub = payload.sub || '';
      }
    } catch (e) { console.warn('[auth] JWT sub decode failed:', e.message); }
    console.log('[auth] QF callback rawUser.sub=%s jwtSub=%s', rawUser?.sub, jwtSub);
    const user = normalizeQFUser(rawUser, jwtSub);
    const session = {
      access_token:  params.get('qf_access_token'),
      refresh_token: params.get('qf_refresh_token') || '',
      expires_at:    Math.floor(Date.now() / 1000) + parseInt(params.get('qf_expires_in') || '3600'),
      id_token:      params.get('qf_id_token') || '',
      user
    };
    localStorage.setItem('fahm_qf_session', JSON.stringify(session));
    currentUser = user;
    history.replaceState(null, '', window.location.pathname);
    updateAuthUI();
    return;
  }

  // ── Supabase (Google) callback ─────────────────────────
  if (!hash.includes('access_token')) return;
  const session = {
    access_token:  params.get('access_token'),
    refresh_token: params.get('refresh_token'),
    expires_at:    Math.floor(Date.now() / 1000) + parseInt(params.get('expires_in') || '3600'),
    user: null
  };
  const r = await fetch(`${GOTRUE_URL}/user`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
  });
  if (r.ok) {
    session.user = await r.json();
    localStorage.setItem('fahm_session', JSON.stringify(session));
    currentUser = session.user;
    history.replaceState(null, '', window.location.pathname);
    await syncProgressFromDB();
    updateAuthUI();
  }
}
